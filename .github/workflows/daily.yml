name: Daily edition
on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 UTC = 6:00 AM ET
  workflow_dispatch: {}     # run manually from the Actions tab anytime

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node pipeline/run.js
      - name: Commit today's edition
        run: |
          git config user.name "forefront-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Edition $(date -u +%F)"
          git push
